services:
  postgres:
    image: postgres:16
    env_file: .env.docker
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_APP_USER}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_APP_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    working_dir: /app/gratitude_bot
    command: >
      sh -c "
      python manage.py collectstatic --noinput &&
      gunicorn gratitude_bot.wsgi:application
      --bind 0.0.0.0:8000
      --workers 2
      --timeout 60
      --access-logfile -
      --error-logfile -
      "
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - static_data:/app/gratitude_bot/staticfiles
      - media_data:/app/gratitude_bot/media
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "8001:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/static:ro
      - media_data:/media:ro
    restart: unless-stopped

  bot:
    build: .
    env_file: .env.docker
    working_dir: /app/gratitude_bot
    command: python manage.py run_bot
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  worker:
    build: .
    env_file: .env.docker
    working_dir: /app/gratitude_bot
    command: celery -A gratitude_bot.celery:app worker -l INFO --concurrency=1
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  beat:
    build: .
    env_file: .env.docker
    working_dir: /app/gratitude_bot
    command: celery -A gratitude_bot.celery:app beat -l INFO --schedule /tmp/celerybeat-schedule.db
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  static_data:
  media_data:
